
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#wrap { width: 100%; height: 640px; position: relative; }
#bar { height: 38px; padding: 0 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border, #e2e8f0); background: rgba(248,250,252,0.6); }
.btn { padding: 3px 9px; border-radius: 9px; border: 1px solid #d1d5db; background: #f9fafb; cursor: pointer; font-size: 11px; color: #6b7280; }
.btn.on { background: #2563eb; color: #fff; border-color: #2563eb; }
#svg-cont { width: 100%; height: 602px; overflow: hidden; }
svg { width: 100%; height: 100%; cursor: grab; }
svg:active { cursor: grabbing; }
.link { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-opacity: 0.65; }
.link.hi { stroke: #f59e0b; stroke-width: 2; stroke-opacity: 1; }
.link.lo { stroke-opacity: 0.07; }
.node { cursor: pointer; }
.node circle { stroke-width: 1.5; }
.node text { font-size: 10px; fill: #374151; pointer-events: none; dominant-baseline: central; }
.node.lo circle { opacity: 0.12; }
.node.lo text { opacity: 0.07; }
#tip { position: absolute; background: rgba(15,23,42,.88); color: #f8fafc; padding: 5px 9px; border-radius: 5px; font-size: 11px; pointer-events: none; display: none; z-index: 30; white-space: nowrap; }
#leg { position: absolute; bottom: 8px; left: 10px; background: rgba(255,255,255,.95); border: 1px solid #e5e7eb; border-radius: 6px; padding: 7px 10px; }
.li { display: flex; align-items: center; gap: 5px; color: #6b7280; margin-bottom: 2px; font-size: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#panel { position: absolute; top: 46px; right: 8px; width: 200px; background: rgba(255,255,255,.97); border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; font-size: 11px; display: none; box-shadow: 0 2px 10px rgba(0,0,0,.1); z-index: 20; }
#panel h4 { font-size: 12px; font-weight: 700; color: #111827; margin-bottom: 3px; word-break: break-all; }
.pfile { color: #9ca3af; font-size: 10px; margin-bottom: 8px; font-family: monospace; word-break: break-all; }
.psec { font-weight: 600; color: #374151; margin-bottom: 2px; margin-top: 6px; }
.plist { color: #6b7280; line-height: 1.65; font-size: 10.5px; }
.pcls { float: right; cursor: pointer; color: #9ca3af; font-size: 16px; line-height: 1; }
</style>

<div id="wrap">
  <div id="bar">
    <span style="font-size:12px;font-weight:700;color:#111827">ST SyncTool</span>
    <span style="font-size:11px;color:#9ca3af">module dependency graph</span>
    <div style="flex:1"></div>
    <button class="btn on" id="btnT">Tests</button>
    <button class="btn on" id="btnL">Labels</button>
    <span id="stat" style="font-size:10px;color:#d1d5db;margin-left:4px"></span>
  </div>
  <div id="svg-cont"><svg id="g"><desc>ST SyncTool module dependency graph showing imports between main, core, gui, utils and test files.</desc></svg></div>
  <div id="tip"></div>
  <div id="leg">
    <div class="li"><div class="dot" style="background:#f59e0b"></div>Entry</div>
    <div class="li"><div class="dot" style="background:#3b82f6"></div>Core</div>
    <div class="li"><div class="dot" style="background:#10b981"></div>GUI</div>
    <div class="li"><div class="dot" style="background:#f97316"></div>Utils</div>
    <div class="li"><div class="dot" style="background:#94a3b8"></div>Tests</div>
  </div>
  <div id="panel">
    <span class="pcls" id="pclose">×</span>
    <h4 id="ptitle"></h4>
    <div class="pfile" id="pfile"></div>
    <div class="psec">Imports</div>
    <div class="plist" id="pimports">—</div>
    <div class="psec">Imported by</div>
    <div class="plist" id="pimportedby">—</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const COLORS = {entry:"#f59e0b",core:"#3b82f6",gui:"#10b981",utils:"#f97316",tests:"#94a3b8"};
const STROKES = {entry:"#b45309",core:"#1d4ed8",gui:"#047857",utils:"#c2410c",tests:"#475569"};
const Y_BANDS = {entry:65,gui:200,core:360,utils:490,tests:565};
const X_CENTERS = {entry:0.5,gui:0.28,core:0.63,utils:0.82,tests:0.5};

const ALL_NODES = [
  {id:"main",label:"main.py",group:"entry"},
  {id:"core/preflight",label:"preflight",group:"core"},
  {id:"core/checksum",label:"checksum",group:"core"},
  {id:"core/comparison",label:"comparison",group:"core"},
  {id:"core/manifest",label:"manifest",group:"core"},
  {id:"core/amphetamine",label:"amphetamine",group:"core"},
  {id:"core/thumbnail",label:"thumbnail",group:"core"},
  {id:"core/media_verify",label:"media_verify",group:"core"},
  {id:"core/offload",label:"offload",group:"core"},
  {id:"core/merge_ops",label:"merge_ops",group:"core"},
  {id:"core/rclone_bridge",label:"rclone_bridge",group:"core"},
  {id:"core/transfer",label:"transfer",group:"core"},
  {id:"core/setup_checks",label:"setup_checks",group:"core"},
  {id:"core/oauth_config",label:"oauth_config",group:"core"},
  {id:"core/demo",label:"demo",group:"core"},
  {id:"core/projects",label:"projects",group:"core"},
  {id:"gui/main_window",label:"main_window",group:"gui"},
  {id:"gui/transfer_tab",label:"transfer_tab",group:"gui"},
  {id:"gui/merge_tab",label:"merge_tab",group:"gui"},
  {id:"gui/verify_tab",label:"verify_tab",group:"gui"},
  {id:"gui/offload_tab",label:"offload_tab",group:"gui"},
  {id:"gui/setup_wizard",label:"setup_wizard",group:"gui"},
  {id:"gui/tutorial_overlay",label:"tutorial_overlay",group:"gui"},
  {id:"gui/diff_table",label:"diff_table",group:"gui"},
  {id:"gui/theme",label:"theme",group:"gui"},
  {id:"gui/log_widget",label:"log_widget",group:"gui"},
  {id:"gui/path_input_widget",label:"path_input",group:"gui"},
  {id:"utils/file_utils",label:"file_utils",group:"utils"},
  {id:"utils/gdrive_utils",label:"gdrive_utils",group:"utils"},
  {id:"utils/volume_watcher",label:"volume_watcher",group:"utils"},
  {id:"tests/test_acceptance_manifest",label:"t_acceptance",group:"tests"},
  {id:"tests/test_checksum",label:"t_checksum",group:"tests"},
  {id:"tests/test_comparison",label:"t_comparison",group:"tests"},
  {id:"tests/test_conflict_resolution",label:"t_conflict",group:"tests"},
  {id:"tests/test_drive_merge",label:"t_drive_merge",group:"tests"},
  {id:"tests/test_drive_verify",label:"t_drive_verify",group:"tests"},
  {id:"tests/test_manifest_ignore",label:"t_manifest_ignore",group:"tests"},
  {id:"tests/test_manifest_migration",label:"t_manifest_migr",group:"tests"},
  {id:"tests/test_media_verify",label:"t_media_verify",group:"tests"},
  {id:"tests/test_merge_ops",label:"t_merge_ops",group:"tests"},
  {id:"tests/test_offload",label:"t_offload",group:"tests"},
  {id:"tests/test_phase2_progress",label:"t_phase2",group:"tests"},
  {id:"tests/test_rclone_bridge",label:"t_rclone",group:"tests"},
];

const ALL_LINKS = [
  {s:"main",t:"core/preflight"},
  {s:"main",t:"gui/main_window"},
  {s:"main",t:"gui/theme"},
  {s:"core/manifest",t:"core/checksum"},
  {s:"core/manifest",t:"core/comparison"},
  {s:"core/merge_ops",t:"core/checksum"},
  {s:"core/merge_ops",t:"core/rclone_bridge"},
  {s:"core/merge_ops",t:"utils/gdrive_utils"},
  {s:"core/offload",t:"core/checksum"},
  {s:"core/offload",t:"core/thumbnail"},
  {s:"core/offload",t:"core/media_verify"},
  {s:"core/rclone_bridge",t:"core/manifest"},
  {s:"core/setup_checks",t:"core/oauth_config"},
  {s:"core/setup_checks",t:"utils/gdrive_utils"},
  {s:"core/transfer",t:"core/checksum"},
  {s:"core/transfer",t:"core/rclone_bridge"},
  {s:"gui/diff_table",t:"gui/theme"},
  {s:"gui/diff_table",t:"core/merge_ops"},
  {s:"gui/diff_table",t:"core/comparison"},
  {s:"gui/main_window",t:"gui/transfer_tab"},
  {s:"gui/main_window",t:"gui/merge_tab"},
  {s:"gui/main_window",t:"gui/verify_tab"},
  {s:"gui/main_window",t:"gui/offload_tab"},
  {s:"gui/main_window",t:"gui/setup_wizard"},
  {s:"gui/main_window",t:"gui/tutorial_overlay"},
  {s:"gui/main_window",t:"gui/theme"},
  {s:"gui/main_window",t:"core/demo"},
  {s:"gui/main_window",t:"core/setup_checks"},
  {s:"gui/main_window",t:"core/oauth_config"},
  {s:"gui/merge_tab",t:"gui/path_input_widget"},
  {s:"gui/merge_tab",t:"gui/log_widget"},
  {s:"gui/merge_tab",t:"gui/diff_table"},
  {s:"gui/merge_tab",t:"gui/theme"},
  {s:"gui/merge_tab",t:"core/manifest"},
  {s:"gui/merge_tab",t:"core/comparison"},
  {s:"gui/merge_tab",t:"core/amphetamine"},
  {s:"gui/merge_tab",t:"core/merge_ops"},
  {s:"gui/merge_tab",t:"core/rclone_bridge"},
  {s:"gui/merge_tab",t:"core/projects"},
  {s:"gui/merge_tab",t:"utils/gdrive_utils"},
  {s:"gui/offload_tab",t:"gui/log_widget"},
  {s:"gui/offload_tab",t:"gui/theme"},
  {s:"gui/offload_tab",t:"core/offload"},
  {s:"gui/offload_tab",t:"core/thumbnail"},
  {s:"gui/offload_tab",t:"core/projects"},
  {s:"gui/offload_tab",t:"utils/volume_watcher"},
  {s:"gui/setup_wizard",t:"gui/theme"},
  {s:"gui/setup_wizard",t:"core/setup_checks"},
  {s:"gui/setup_wizard",t:"core/oauth_config"},
  {s:"gui/setup_wizard",t:"utils/gdrive_utils"},
  {s:"gui/transfer_tab",t:"gui/path_input_widget"},
  {s:"gui/transfer_tab",t:"gui/log_widget"},
  {s:"gui/transfer_tab",t:"gui/theme"},
  {s:"gui/transfer_tab",t:"core/transfer"},
  {s:"gui/transfer_tab",t:"core/amphetamine"},
  {s:"gui/transfer_tab",t:"core/demo"},
  {s:"gui/transfer_tab",t:"core/rclone_bridge"},
  {s:"gui/transfer_tab",t:"utils/file_utils"},
  {s:"gui/transfer_tab",t:"utils/gdrive_utils"},
  {s:"gui/verify_tab",t:"gui/path_input_widget"},
  {s:"gui/verify_tab",t:"gui/log_widget"},
  {s:"gui/verify_tab",t:"gui/theme"},
  {s:"gui/verify_tab",t:"core/manifest"},
  {s:"gui/verify_tab",t:"core/checksum"},
  {s:"gui/verify_tab",t:"core/rclone_bridge"},
  {s:"gui/verify_tab",t:"utils/gdrive_utils"},
  {s:"tests/test_acceptance_manifest",t:"core/offload"},
  {s:"tests/test_acceptance_manifest",t:"core/manifest"},
  {s:"tests/test_acceptance_manifest",t:"core/comparison"},
  {s:"tests/test_checksum",t:"core/checksum"},
  {s:"tests/test_comparison",t:"core/comparison"},
  {s:"tests/test_conflict_resolution",t:"core/comparison"},
  {s:"tests/test_conflict_resolution",t:"core/merge_ops"},
  {s:"tests/test_drive_merge",t:"core/merge_ops"},
  {s:"tests/test_drive_verify",t:"gui/verify_tab"},
  {s:"tests/test_manifest_ignore",t:"core/manifest"},
  {s:"tests/test_manifest_migration",t:"core/manifest"},
  {s:"tests/test_media_verify",t:"core/media_verify"},
  {s:"tests/test_merge_ops",t:"core/merge_ops"},
  {s:"tests/test_offload",t:"core/offload"},
  {s:"tests/test_phase2_progress",t:"gui/log_widget"},
  {s:"tests/test_phase2_progress",t:"core/rclone_bridge"},
  {s:"tests/test_rclone_bridge",t:"core/rclone_bridge"},
];

let showTests = true, showLabels = true;
let simNodes = [], simLinks = [], sim;
let linkSel, nodeSel;

const cont = document.getElementById("svg-cont");
const W = cont.offsetWidth || 860;
const H = 602;
const svg = d3.select("#g").attr("viewBox", `0 0 ${W} ${H}`);

const defs = svg.append("defs");
function addArrow(id, color) {
  defs.append("marker")
    .attr("id", id).attr("viewBox","0 -4 8 8")
    .attr("refX",8).attr("refY",0)
    .attr("markerWidth",5).attr("markerHeight",5)
    .attr("orient","auto")
    .append("path").attr("d","M0,-4L8,0L0,4").attr("fill", color);
}
addArrow("arr","#94a3b8");
addArrow("arr-hi","#f59e0b");

const zoomLayer = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2,4]).on("zoom", e => zoomLayer.attr("transform", e.transform));
svg.call(zoom);

function build() {
  if (sim) sim.stop();
  document.getElementById("panel").style.display = "none";

  simNodes = ALL_NODES.filter(n => showTests || n.group !== "tests").map(n => ({...n}));
  const ids = new Set(simNodes.map(n => n.id));
  simLinks = ALL_LINKS.filter(l => ids.has(l.s) && ids.has(l.t)).map(l => ({source:l.s, target:l.t}));

  const inDeg = {};
  simLinks.forEach(l => { inDeg[l.target] = (inDeg[l.target]||0) + 1; });
  simNodes.forEach(n => { n.r = Math.max(7, 5 + (inDeg[n.id]||0) * 1.6); });

  // Seed positions
  const jitter = () => (Math.random() - 0.5) * 90;
  simNodes.forEach(n => {
    n.x = W * (X_CENTERS[n.group]||0.5) + jitter();
    n.y = Y_BANDS[n.group] + jitter() * 0.5;
  });

  document.getElementById("stat").textContent = `${simNodes.length} modules · ${simLinks.length} imports`;

  zoomLayer.selectAll("*").remove();

  const lg = zoomLayer.append("g");
  linkSel = lg.selectAll("line").data(simLinks).join("line")
    .attr("class","link").attr("marker-end","url(#arr)");

  const ng = zoomLayer.append("g");
  nodeSel = ng.selectAll("g").data(simNodes, d => d.id).join("g").attr("class","node")
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
    )
    .on("mouseover",(e,d)=>{
      const tip = document.getElementById("tip");
      const [mx,my] = d3.pointer(e, document.getElementById("wrap"));
      tip.textContent = d.id;
      tip.style.display = "block";
      tip.style.left = (mx+14)+"px";
      tip.style.top = (my-10)+"px";
    })
    .on("mouseout", () => { document.getElementById("tip").style.display = "none"; })
    .on("click",(e,d)=>{ e.stopPropagation(); doSelect(d); });

  nodeSel.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => COLORS[d.group])
    .attr("stroke", d => STROKES[d.group]);

  nodeSel.append("text")
    .attr("x", d => d.r + 3).attr("y", 0)
    .text(d => d.label)
    .style("display", showLabels ? null : "none");

  sim = d3.forceSimulation(simNodes)
    .force("link", d3.forceLink(simLinks).id(d=>d.id).distance(88).strength(.32))
    .force("charge", d3.forceManyBody().strength(-260))
    .force("x", d3.forceX(d => (X_CENTERS[d.group]||.5)*W).strength(.1))
    .force("y", d3.forceY(d => Y_BANDS[d.group]).strength(.22))
    .force("collide", d3.forceCollide(d => d.r + 10))
    .on("tick", tick);

  svg.on("click", () => {
    clearSel();
    document.getElementById("panel").style.display = "none";
  });
}

function tick() {
  linkSel
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => {
      const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
      const dist = Math.sqrt(dx*dx+dy*dy)||1;
      return d.target.x - (dx/dist)*(d.target.r+2);
    })
    .attr("y2", d => {
      const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
      const dist = Math.sqrt(dx*dx+dy*dy)||1;
      return d.target.y - (dy/dist)*(d.target.r+2);
    });
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

function getId(x) { return (x && typeof x === "object") ? x.id : x; }

function doSelect(d) {
  const srcSet = new Set(simLinks.filter(l => getId(l.source)===d.id).map(l => getId(l.target)));
  const tgtSet = new Set(simLinks.filter(l => getId(l.target)===d.id).map(l => getId(l.source)));
  const connected = new Set([d.id, ...srcSet, ...tgtSet]);

  nodeSel.classed("lo", n => !connected.has(n.id));
  linkSel
    .classed("hi", l => getId(l.source)===d.id || getId(l.target)===d.id)
    .classed("lo", l => getId(l.source)!==d.id && getId(l.target)!==d.id)
    .attr("marker-end", l => (getId(l.source)===d.id||getId(l.target)===d.id) ? "url(#arr-hi)" : "url(#arr)");

  const nodeMap = new Map(simNodes.map(n => [n.id, n]));
  const imps = [...srcSet].map(id => (nodeMap.get(id)||{label:id}).label);
  const impby = [...tgtSet].map(id => (nodeMap.get(id)||{label:id}).label);

  document.getElementById("ptitle").textContent = d.label;
  document.getElementById("pfile").textContent = d.id + ".py";
  document.getElementById("pimports").textContent = imps.length ? imps.join(", ") : "none";
  document.getElementById("pimportedby").textContent = impby.length ? impby.join(", ") : "none";
  document.getElementById("panel").style.display = "block";
}

function clearSel() {
  if (nodeSel) nodeSel.classed("lo", false);
  if (linkSel) linkSel.classed("hi",false).classed("lo",false).attr("marker-end","url(#arr)");
}

document.getElementById("btnT").addEventListener("click", function() {
  showTests = !showTests;
  this.classList.toggle("on", showTests);
  build();
});

document.getElementById("btnL").addEventListener("click", function() {
  showLabels = !showLabels;
  this.classList.toggle("on", showLabels);
  if (nodeSel) nodeSel.selectAll("text").style("display", showLabels ? null : "none");
});

document.getElementById("pclose").addEventListener("click", () => {
  document.getElementById("panel").style.display = "none";
  clearSel();
});

build();
</script>
